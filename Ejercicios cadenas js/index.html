<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔍 Analizador de Texto</title>
  <link rel="stylesheet" href="estilos.css" />
  <script src="cadenas.js" defer></script>
</head>
<body>
  <header class="header-futurista">
    <div class="glow-border">
      <h1>🧠 ANALIZADOR DE TEXTO</h1>
    </div>
  </header>

  <main>
    <input type="text" id="textoInput" placeholder="Escribe tu texto aquí..." />

    <div class="contenedor-horizontal">
      <section class="bloque">
        <button onclick="mostrarVocales()">Contar Vocales</button>
        <div id="resultadoVocales" class="resultado">Vocales: —</div>
      </section>

      <section class="bloque">
        <button onclick="mostrarPalabras()">Contar Palabras</button>
        <div id="resultadoPalabras" class="resultado"> Palabras: —</div>
      </section>

      <section class="bloque">
        <button onclick="mostrarCaracteres()">Contar Caracteres</button>
        <div id="resultadoCaracteres" class="resultado">Caracteres: —</div>
      </section>
    </div>
  </main>

  <footer class="footer-futurista">
    <div class="glow-border">
      <p>&copy; Proyecto Web Creativo 💡</p>
    </div>
  </footer>

  <script>
    function mostrarVocales() {
      const texto = document.getElementById("textoInput").value;
      const resultado = ContarVocales(texto);
      document.getElementById("resultadoVocales").textContent = ` Vocales: ${resultado}`;
    }

    function mostrarPalabras() {
      const texto = document.getElementById("textoInput").value;
      const resultado = ContarPalabras(texto);
      document.getElementById("resultadoPalabras").textContent = ` Palabras: ${resultado}`;
    }

    function mostrarCaracteres() {
      const texto = document.getElementById("textoInput").value;
      const resultado = ContarCaracteres(texto);
      document.getElementById("resultadoCaracteres").textContent = ` Caracteres: ${resultado}`;
    }
  </script>
</body>
</html>
