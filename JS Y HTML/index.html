<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title> PROGRAMA ALEATORIO🚀</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>PROGRAMA ALEATORIO🚀</h1>
    <div class="scanner-line"></div>
  </header>

  <main class="contenedor">
    <section class="bloque bloque-nombre">
      <h2>¿Cuál es tu nombre?</h2>
      <input type="text" id="nombre" placeholder="Escribe tu nombre aquí" />
      <button onclick="mostrarNombre()">Mostrar</button>
      <div id="saludo" class="saludo-texto"></div>
    </section>

    <section class="bloque bloque-lista">
      <h2>Lista Dinámica</h2>
      <button onclick="InsertarLista()">Insertar número aleatorio</button>

      <div class="eliminar-box">
        <input type="number" id="eliminarValor" placeholder="Número a eliminar" />
        <button onclick="EliminarLista()">Eliminar</button>
      </div>

      <div id="resultado" class="lista-dinamica"></div>
    </section>
  </main>

  <footer>
    <div class="scanner-line"></div>
    <p>🚀 Diseñado por Jaqueline</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
