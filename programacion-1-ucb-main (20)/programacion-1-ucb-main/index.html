<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Aplicación Futurista</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Panel de Control</h1>
  </header>

  <main class="contenedor">

    <!-- SALUDO -->
    <section class="bloque">
      <h2>Saludo</h2>
      <input type="text" id="input" placeholder="Escribe tu nombre" />
      <button onclick="mostrarNombre()">Mostrar</button>
      <p id="resultado" class="saludo-texto"></p>
    </section>

    <!-- LISTA DINÁMICA -->
    <section class="bloque">
      <h2>Lista de Números</h2>
      <button onclick="InsertarLista()">Insertar Número</button>
      <button onclick="EliminarElementoLista()">Eliminar Número</button>
      <input type="text" id="inputEliminar" placeholder="Número a eliminar" />
      <div id="lista-contenedor" class="lista-dinamica"></div>
    </section>

    <!-- FUNCIONES DE ESTUDIANTES -->
    <section class="bloque">
      <h2>Funciones de Estudiantes</h2>
      <button onclick="MostrarNombre()">Mostrar Años de Nacimiento</button>
      <button onclick="MostrarHabilitadosOEP()">Mostrar Habilitados OEP</button>
      <div id="funciones-output"></div>
    </section>

    <!-- FORMULARIO DE ESTUDIANTE -->
    <section class="bloque">
      <h2>Agregar Estudiante</h2>
      <input type="text" id="input_name" placeholder="Nombre completo" />
      <input type="text" id="input_edad" placeholder="Edad" />
      <input type="text" id="input_correo" placeholder="Correo electrónico" />
      <input type="text" id="input_carrera" placeholder="Carrera" />
      <input type="text" id="input_phone" placeholder="Teléfono" />
      <button onclick="AddEstudiante()">Agregar</button>
    </section>

    <!-- TABLA -->
    <section class="bloque">
      <h2>Tabla de Estudiantes</h2>
      <div id="tabla-container"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
